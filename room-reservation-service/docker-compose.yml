services:
  postgres:
    image: postgres:16-alpine
    container_name: room_reservation_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - room_reservation_net

  room-reservation-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: room-reservation-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - room_reservation_net

volumes:
  pgdata:

networks:
  room_reservation_net: